server:
  port: 8081

spring:
  profiles:
    active: local
  application:
    name: haalkhata-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}?currentSchema=${DB_SCHEMA:hk}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
    hikari:
      maximum-pool-size: 10
  flyway:
    schemas: ${DB_SCHEMA:hk}
    create-schemas: true
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:hk}
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  # CRITICAL: override JWT_SECRET / TRUSTED_JWT_SECRET in production with
  # unique, non-default values. The defaults below are dev-only.
  jwt-secret: ${JWT_SECRET:haalkhata-dev-secret-change-me-in-production-0123456789abcdef}
  trusted-jwt-secret: ${TRUSTED_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
  jwt-issuer: ${JWT_ISSUER:haalkhata-service}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:10080}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
  verification-code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:10}
  otp-ttl-minutes: ${OTP_TTL_MINUTES:5}
  storage-dir: ${HAALKHATA_STORAGE_DIR:./storage}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  mail-provider: ${MAIL_PROVIDER:console}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  firebase-service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  firebase-service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
  ai-provider-mode: ${AI_PROVIDER_MODE:chain}
  orca-api-key: ${ORCA_API_KEY:}
  orca-model: ${ORCA_MODEL:deepseek/deepseek-v4-flash-free}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: ${GROQ_MODEL:qwen/qwen3.8-27b}
  groq-stt-model: ${GROQ_STT_MODEL:whisper-large-v3-turbo}
  log-request-body: ${LOG_REQUEST_BODY:true}
  # Keep premium API entitlements on outside local/demo environments.
  enforce-subscription: ${SUBSCRIPTION_ENFORCEMENT:true}
  public-base-url: ${PUBLIC_BASE_URL:}
  # Global support agents only. Never use a shop's ADMIN role for this.
  support-admin-user-ids: ${SUPPORT_ADMIN_USER_IDS:}
  platform-admin-user-ids: ${PLATFORM_ADMIN_USER_IDS:}
  bkash:
    base-url: ${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}
    app-key: ${BKASH_APP_KEY:4f6o0cjiki2rfm34kfdadl1eqq}
    app-secret: ${BKASH_APP_SECRET:2is7hdktrekvrbljjh44ll3d9l1dtjo4pasmjvs5vl5qr3fug4b}
    username: ${BKASH_USERNAME:sandboxTokenizedUser02}
    password: ${BKASH_PASSWORD:sandboxTokenizedUser02@12345}
    callback-url: ${BKASH_CALLBACK_URL:https://callback.example.com/api/v1/bkash/callback}
    sandbox: ${BKASH_SANDBOX:true}

logging:
  level:
    root: INFO
    com.haalkhata: DEBUG
    org.hibernate.SQL: WARN
